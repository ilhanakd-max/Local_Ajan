[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lokal-ajan"
version = "0.2.1"
description = "Ollama tabanlı lokal agentic CLI aracı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "prompt-toolkit>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
lokal-ajan = "lokal_ajan.cli:app"
localajan = "lokal_ajan.cli:app"

